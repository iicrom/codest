[package]
name = "codest"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal TUI chat agent distilled from codex's TUI + core architecture"
license = "Apache-2.0"
default-run = "codest"

[workspace]
members = ["crates/cst-plugin-api"]
resolver = "3"

[lib]
name = "codest"
path = "src/lib.rs"

[[bin]]
name = "codest"
path = "src/main.rs"

[[bin]]
name = "cst"
path = "src/bin/cst.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
cst-plugin-api = { path = "crates/cst-plugin-api", version = "0.1.0" }
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Syntax highlighting for fenced code: `regex-fancy` is the pure-Rust engine,
# so no oniguruma C toolchain is needed. `two-face` carries bat's syntax dump,
# which covers languages syntect's own set lacks (TypeScript, TOML, Dockerfile).
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "dump-load",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
unicode-width = "0.2"
# Session ids. v7 is time-ordered, so rollout file names sort by creation.
uuid = { version = "1", features = ["v7"] }

# Process-group kill for the `bash` tool's timeout watchdog (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
