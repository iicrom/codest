[package]
name = "codest"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal TUI chat agent distilled from codex's TUI + core architecture"
license = "Apache-2.0"
default-run = "codest"

[lib]
name = "codest"
path = "src/lib.rs"

[[bin]]
name = "codest"
path = "src/main.rs"

[[bin]]
name = "cst"
path = "src/bin/cst.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
unicode-width = "0.2"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
