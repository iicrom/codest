[package]
name = "codest"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal TUI chat agent distilled from codex's TUI + core architecture"
license = "Apache-2.0"
repository = "https://github.com/iicrom/codest"
default-run = "codest"

[workspace]
members = ["crates/cst-plugin-api"]
resolver = "3"

[lib]
name = "codest"
path = "src/lib.rs"

[[bin]]
name = "codest"
path = "src/main.rs"

[[bin]]
name = "cst"
path = "src/bin/cst.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
cst-plugin-api = { path = "crates/cst-plugin-api", version = "0.1.0" }
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
# Only the crossterm backend is used (plus TestBackend in tests), so the
# default set is dropped: `all-widgets` (calendar → `time` crate) and the
# unused backend crates stay out of the build.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Syntax highlighting for fenced code: `regex-fancy` is the pure-Rust engine,
# so no oniguruma C toolchain is needed. `two-face` carries bat's syntax dump,
# which covers languages syntect's own set lacks (TypeScript, TOML, Dockerfile).
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "dump-load",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
two-face = { version = "0.5", default-features = false, features = [
    "syntect-fancy",
] }
unicode-width = "0.2"
# Session ids. v7 is time-ordered, so rollout file names sort by creation.
uuid = { version = "1", features = ["v7"] }

# Process-group kill for the shell tool's timeout watchdog (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

# Interactive TUI time lives in the dependencies — syntect highlighting,
# markdown parsing, unicode width tables — so an unoptimized dev build made
# every frame and every Ctrl+O expansion several times slower than release.
# Dependencies compile once and stay cached; the crate itself stays at 0 for
# fast iteration.
[profile.dev.package."*"]
opt-level = 2

# No `panic = "abort"`: the plugin task runner unwinds caught panics
# (catch_unwind in src/tui/app.rs), which abort would turn into process death.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
