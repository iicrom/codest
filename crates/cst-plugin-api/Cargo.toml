[package]
name = "cst-plugin-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Contract types shared by codest, its built-in plugins, and external provider plugins"
license = "Apache-2.0"
repository = "https://github.com/fufu/cst"
readme = "README.md"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-util = "0.7"
toml = "0.9"
